# C1 Breakout v2 Configuration
# 15m Channel Breakout + Fractal SL + ATR Trailing TP
# Validated: PnL +169.5% (additive 1x), MDD 5.4%, WF 5/5, MC p=0.000

strategy:
  channel_period: 15
  body_min_ratio: 0.4
  atr_period: 14
  trail_K: 2.5
  max_sl_atr: 3.3
  emergency_sl_pct: 3.0
  max_hold_bars: 192    # 48 hours
  sl_min_pct: 0.15
  sl_max_pct: 3.0
  min_bars_between: 2
  trail_activation_pct: 0.05
  max_positions: 1       # BTC 단일종목 = 1포지션
  backstop_tp_atr: 0      # Disabled — trail has no cap, SL only on exchange

  # regime_filter_trend PDCA (2026-04-19): 9/9 GO BT but neighborhood 2/25 overfit 의심.
  # 30일 LIVE 관찰 후 조건부 활성화 예정. 기본값 false(무동작).
  trend_filter:
    enabled: false              # 30일 LIVE sample 수집 후 재평가 시 true로 변경
    lookback_bars: 192          # 2일 rolling
    min_abs_trend_pct: 1.0      # |(close/close_lb - 1)*100| ≥ 1.0 시 진입 허용

  # progressive_trail PDCA (2026-04-21): 9/9 CORE + 5/5 WARN FULL GO.
  # Neighborhood 22/25 (non-sharp-peak), MC p=0.0000, 2-half delta 양호.
  # 2026-04-21 사용자 명령으로 30일 baseline 대기 없이 즉시 활성 전환.
  progressive_trail:
    enabled: true               # 2026-04-21 즉시 활성 (사용자 명령)
    threshold_pct: 0.9          # best_pnl 0.9% 초과 시 tk_post로 전환
    trail_K_post: 0.5           # 전환 후 tight trail K

  # activation_gated_trail PDCA (F옵션, 2026-04-22):
  # E(pre_activation_baton) Phase 1 파산 확인 후 역방향 접근 시도.
  # 2026-04-22 Canary 시작 → 2026-04-24 ROLLBACK:
  #   - 8 trades 동안 BT +3.60% vs LIVE -6.96%, gap -10.56pp (2일)
  #   - Exit reasons: BT 100% TRAIL_TP vs LIVE 87.5% EXCHANGE_SL
  #   - 근본 원인: BT check_exit의 "soft break-even" (best_pnl>0.05% 후 entry 회귀 시
  #     trail_dist 초과 → close에서 exit) 메커니즘이 LIVE baton STOP_MARKET(fixed trigger)에
  #     의해 복원되지 않음. Entry 회귀 시 STOP은 trigger 안 됨 → SL까지 대기.
  #   - Plan GO 조건 4/7 실패 → STOP 판정
  # F v2 재설계: check_exit를 LIVE bot cycle에 직접 통합 + MARKET close
  activation_gated_trail:
    enabled: false              # 2026-04-24 ROLLBACK (F v1 structural 실패)

risk: {}  # No halt brakes — all removed per 2026-04-13

exchange:
  symbol: BTC-USDT
  timeframe: 15m
  leverage: 10             # Exchange max leverage setting (BingX account)
  trading_leverage: 3      # Actual position sizing leverage (qty = balance × 3 / price)
  position_mode: One-Way   # positionSide=BOTH (One-Way mode)
  candle_bars_fetch: 100

bot:
  poll_interval_seconds: 900  # 15 minutes
  warmup_bars: 25
