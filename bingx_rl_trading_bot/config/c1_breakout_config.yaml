# C1 Breakout v2 Configuration
# 15m Channel Breakout + Fractal SL + ATR Trailing TP
# Validated: PnL +169.5% (additive 1x), MDD 5.4%, WF 5/5, MC p=0.000

strategy:
  channel_period: 15
  body_min_ratio: 0.4
  atr_period: 14
  trail_K: 2.5
  # max_sl_atr 4.5 (2026-04-25 wider_sl_sweep: 333d +28pp 1x, SL% 14.3→10.5).
  # Stop hunt 회피 quick win — 22d/333d 모두 sweet spot 일관.
  # 이전 3.3 (legacy): wick exit에 SL 자주 hit, BT-LIVE 갭 누적.
  max_sl_atr: 4.5
  emergency_sl_pct: 3.0
  max_hold_bars: 192    # 48 hours
  sl_min_pct: 0.15
  sl_max_pct: 3.0
  min_bars_between: 2
  trail_activation_pct: 0.05
  max_positions: 1       # BTC 단일종목 = 1포지션
  backstop_tp_atr: 0      # Disabled — trail has no cap, SL only on exchange

  # regime_filter_trend PDCA (2026-04-19): 9/9 GO BT but neighborhood 2/25 overfit 의심.
  # 30일 LIVE 관찰 후 조건부 활성화 예정. 기본값 false(무동작).
  trend_filter:
    enabled: false              # 30일 LIVE sample 수집 후 재평가 시 true로 변경
    lookback_bars: 192          # 2일 rolling
    min_abs_trend_pct: 1.0      # |(close/close_lb - 1)*100| ≥ 1.0 시 진입 허용

  # progressive_trail PDCA (2026-04-21): 9/9 CORE + 5/5 WARN FULL GO.
  # Neighborhood 22/25 (non-sharp-peak), MC p=0.0000, 2-half delta 양호.
  # 2026-04-21 사용자 명령으로 30일 baseline 대기 없이 즉시 활성 전환.
  progressive_trail:
    enabled: true               # 2026-04-21 즉시 활성 (사용자 명령)
    threshold_pct: 0.9          # best_pnl 0.9% 초과 시 tk_post로 전환
    trail_K_post: 0.5           # 전환 후 tight trail K

  # activation_gated_trail PDCA (F v1, 2026-04-22) — ❌ ROLLBACK 2026-04-24.
  # 실패 원인: post-activation baton STOP_MARKET이 static trigger라서 entry 회귀 시 발동 안 함.
  activation_gated_trail:
    enabled: false

  # f_v2_cycle_exit PDCA (F v2, 2026-04-24):
  # F v1 실패 후 재설계. 모든 거래소 trail 배치 제거 (pre + post activation 모두).
  # cycle check_exit(bot.py:801)만 trail TP 담당 → MARKET close.
  # 봇이 이미 매 cycle check_exit 호출 중이므로 최소 변경:
  #   _update_exchange_trail에서 trail 관련 배치 로직 전부 skip, SL만 verify.
  # Fractal SL은 거래소 STOP_MARKET 유지 (crash safety).
  # Advisor 검증: Class C 4/8 (50%) — ~50% trades 개선 기대.
  # Entry timing 검증: BT=LIVE 동일 bar (±0.02% slippage 미미).
  # 2026-04-24 Canary 시작: 150/150 pytest PASS 후 활성.
  f_v2_cycle_exit:
    enabled: true               # 2026-04-24 Canary (50% trades 개선 기대)

  # f_v3_limit_close PDCA (F v3, 2026-04-27):
  # F v2 cycle MARKET close의 -0.84% avg slippage (n=3: #43 -0.638%, #45 -0.605%, #46 -1.285%) 해결.
  # TRAIL_TP 시 LIMIT @ theoretical exit_price 배치, 60s timeout 시 MARKET fallback.
  # ⚠️ enabled=false (Trade #74 brake 후 활성화 prep). 현 cohort #44~#73에 영향 없음.
  f_v3_limit_close:
    enabled: false              # Brake fire 후 활성화 (single-variable 원칙 보호)
    timeout_s: 60               # LIMIT 대기 (cycle 15min 내 안전)

risk: {}  # No halt brakes — all removed per 2026-04-13

exchange:
  symbol: BTC-USDT
  timeframe: 15m
  leverage: 10             # Exchange max leverage setting (BingX account)
  trading_leverage: 3      # Actual position sizing leverage (qty = balance × 3 / price)
  position_mode: One-Way   # positionSide=BOTH (One-Way mode)
  candle_bars_fetch: 100

bot:
  poll_interval_seconds: 900  # 15 minutes
  warmup_bars: 25
