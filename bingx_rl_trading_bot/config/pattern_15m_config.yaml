api:
  max_retry_delay: 30
  retry_attempts: 3
  retry_delay: 2
debug_mode: true
exchange_leverage: 10
health_check_interval: 50
json_logging: false
leverage: 3
margin_mode: crossed
max_positions: 5           # v1.36.0: 5 slots (15m wider SL → conservative sizing, 1/N=20%)
position_mode: hedge
position_size_pct: 95
risk:
  max_daily_loss_pct: 21   # v1.36.0: 15m SL max 6.86% × 3x = 20.6% per trade (single-loss cap)
  max_position_size_usd: 10000
  mdd_sizing:
    enabled: true
    full_size_below_dd: 5.0    # more conservative than 5m (wider SL)
    min_size_above_dd: 20.0
    min_scale: 0.25
  aggregate_risk_cap:
    enabled: true
    counter_cap: 3.0
    with_cap: 7.0
  regime_sizing:
    enabled: true
    ema_period: 20
    lookback: 5
    counter_mult: 0.3
rotation:
  enabled: false
strategy:
  atr_scale:
    enabled: true
    window: 192          # 2 days of 15m bars (192 × 15m = 48h, equivalent to 5m's 576)
    clamp_lo: 0.6
    clamp_hi: 1.7
  cooldown_candles: 0
  direction_cap: 4       # v1.36.0: conservative for 15m (4/5 = 80%)
  rescan_interval_days: 60
  timeout_bars: 288      # 72h = 288 × 15m bars (equivalent to 5m's 864)
  pattern_source: dynamic
  sl_pct: 3.0            # v1.36.0: wider fallback for 15m
  tp_pct: 3.0            # v1.36.0: wider fallback for 15m
symbol: BTC-USDT
timeframe: 15m
