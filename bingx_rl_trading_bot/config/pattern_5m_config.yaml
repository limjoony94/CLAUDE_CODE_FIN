api:
  max_retry_delay: 30
  retry_attempts: 3
  retry_delay: 2
debug_mode: true
exchange_leverage: 10
health_check_interval: 50
json_logging: false
leverage: 3
margin_mode: crossed
position_mode: one-way
position_size_pct: 95
risk:
  max_daily_loss_pct: 10
  max_position_size_usd: 10000
rotation:
  enabled: false
strategy:
  cooldown_candles: 0
  # v1.22.0: 12 patterns (7 LONG + 5 SHORT), DN-D-BD removed (overfitting diagnosis)
  # Per-pattern TP/SL in constants.py PATTERN_OPTIMAL_TPSL (tp_pct/sl_pct are fallback defaults)
  long_patterns:
  - U-MU-H
  - MD-ST-MD
  - GS-U-BD
  - MD-MD-ST
  - BU-IH-DN
  - MD-H-MD
  - IH-MD-MD
  short_patterns:
  - BD-U-GS
  - DN-GS-H
  - U-DF-BU
  - BD-GS-BD
  - DN-IH-IH
  sl_pct: 1.0
  tp_pct: 1.0
symbol: BTC-USDT
timeframe: 5m
