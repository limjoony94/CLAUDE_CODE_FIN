api:
  max_retry_delay: 30
  retry_attempts: 3
  retry_delay: 2
debug_mode: true
exchange_leverage: 10
health_check_interval: 50
json_logging: false
leverage: 3
margin_mode: crossed
max_positions: 9
position_mode: hedge  # 'one_way' (BOTH) or 'hedge' (LONG/SHORT separate)
position_size_pct: 95
risk:
  max_daily_loss_pct: 13   # v1.28.5: 10% → 13% (Per-pattern SL max 4.0% × 3x = 12.1% per loss)
  max_position_size_usd: 10000
  mdd_sizing:              # v1.34.0: MDD-based dynamic position sizing
    enabled: true
    full_size_below_dd: 5.0   # DD < 5% → full size (scale=1.0)
    min_size_above_dd: 20.0   # DD >= 20% → minimum size (scale=0.25)
    min_scale: 0.25           # minimum position scale factor
rotation:
  enabled: false
strategy:
  atr_scale:
    enabled: true
    window: 576       # rolling median window (576봉 = 2일)
    clamp_lo: 0.6     # minimum ratio
    clamp_hi: 1.7     # maximum ratio
  cooldown_candles: 0
  direction_cap: 8         # v1.35.1: cap6→cap8 (WF 3/3 PASS, PnL/MDD 2.56x, 296d study)
  rescan_interval_days: 90  # v1.34.0: scan staleness warning threshold (days)
  timeout_bars: 864        # v1.31.0: 72h position timeout (864 × 5m = 72h, 0 = disabled)
  pattern_source: dynamic  # 'static' (constants.py) or 'dynamic' (results/dynamic_patterns.json)
  # v1.25.0: Patterns defined in constants.py (VALIDATED_LONG/SHORT_PATTERNS)
  # Per-pattern TP/SL in constants.py PATTERN_OPTIMAL_TPSL (tp_pct/sl_pct are fallback defaults)
  sl_pct: 1.0
  tp_pct: 1.0
symbol: BTC-USDT
timeframe: 5m
