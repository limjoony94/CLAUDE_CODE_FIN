api:
  max_retry_delay: 30
  retry_attempts: 3
  retry_delay: 2
debug_mode: true
exchange_leverage: 10
health_check_interval: 50
json_logging: false
leverage: 3
margin_mode: crossed
max_positions: 9
position_mode: hedge  # 'one_way' (BOTH) or 'hedge' (LONG/SHORT separate)
position_size_pct: 95
risk:
  max_daily_loss_pct: 13   # v1.28.5: 10% → 13% (Per-pattern SL max 4.0% × 3x = 12.1% per loss)
  max_position_size_usd: 10000
  mdd_sizing:              # v1.34.0: MDD-based dynamic position sizing
    enabled: true
    full_size_below_dd: 3.0   # v1.35.2: 5→3% (faster DD response, edge half-life 30d)
    min_size_above_dd: 15.0   # v1.35.2: 20→15% (tighter drawdown protection)
    min_scale: 0.25           # minimum position scale factor
  aggregate_risk_cap:      # v1.35.5→v1.44.0: Aggregate directional SL exposure cap (relaxed from 3/7 to 5/15)
    enabled: true
    counter_cap: 10.0        # v1.65.0: 999→10 (preemptive_param_crossval: re-enabled with pre-emptive cascade, OOS +368.9% at 10 vs +340% at 8)
    with_cap: 15.0           # v1.65.0: 999→15 (restored, works with DirCap=6)
  loss_burst_brake:        # v1.37.0: Block direction after burst losses — v1.40.1 DISABLED (redundant with momentum_guard, ablation +5.66)
    enabled: false
    threshold: 2             # number of same-dir losses to trigger brake
    window_bars: 288         # 288 bars = 24h window to count losses
    block_bars: 144          # 144 bars = 12h block duration
  cascade_sl_tightening:   # v1.68.0: Market-Close Cascade (MCC) — SL exit → market-close ALL same-dir
    enabled: true            # v1.68.0: RE-ENABLED as MCC (market close, not SL modification). SL tighten code bypassed.
    tighten_pct: 98
  preemptive_cascade:      # v1.65.0: Pre-emptive SL tightening when unrealized loss exceeds threshold
    enabled: false           # v1.68.0: DISABLED — Same issue: tightened SLs trigger on normal volatility. Mechanism works (6/6 SUCCESS) but effect is harmful (forced closure of surviving positions).
    unrealized_loss_pct: 2.0
    tighten_pct: 98
  momentum_guard:          # v1.36.2→v1.46.0: Pause counter-dir entries during strong moves
    enabled: true
    lookback_bars: 3         # v1.46.0: 6→3 bars = 15min (faster spike detection, momentum_guard_sweep_study)
    threshold_pct: 1.5       # v1.51.0: 1.0→1.5% (atr_infra_sweep_study: IS PnL/MDD +5.3%, MDD -3%, OOS identical, less aggressive blocking)
    cooldown_bars: 12        # v1.46.0: 6→12 bars = 1h (longer protection after trigger)
  equity_curve_trading:    # v1.40.0: Equity Curve Trading (Combo2-H1) — v1.40.1 DISABLED (harmful: PnL -11.4%, MDD unchanged, ablation +1.96)
    enabled: false
    ema_trades: 30           # SMA lookback in completed trades (per-direction)
    size_mult: 0.5           # size multiplier when direction's cum_pnl < SMA
  correlation_aware_entry:  # v1.40.0: Correlation-Aware Entry (Combo2-H6) — v1.40.1 DISABLED (redundant with regime_sizing, redundancy 71.75)
    enabled: false
    dir_pct_threshold: 0.70  # same-direction ratio threshold (block counter-regime above this)
  regime_sizing:           # v1.35.3: Regime-aware position sizing — v1.42.0 DISABLED (M2+M4 redundancy -46.94, P3 CascadeSL replaces MDD defense)
    enabled: false
    ema_period: 20           # EMA window for trend detection
    lookback: 5              # slope lookback bars (EMA[now] - EMA[now-5])
    counter_mult: 0.3        # counter-regime size multiplier (MDD lowest: 6.71%)
rotation:
  enabled: false
strategy:
  adaptive_leverage:
    enabled: false          # v1.42.0 DISABLED — M2+M4 redundancy -46.94, P3 CascadeSL replaces MDD defense. Re-enable: true
    method: "wr_confidence" # wr_confidence | kelly | breakeven | combined | exp_decay
    min_leverage: 1.0
    max_leverage: 3.0
    window: 12              # v1.39.0: w12 best OOS consistency 0.823, DD stress lev -47%
    expected_wr: 73.2       # from npos_portfolio IS stats (%)
    ref_edge: 0.126         # from npos_portfolio IS pnl_per_trade (%)
  atr_scale:
    enabled: true
    window: 576       # rolling median window (576봉 = 2일)
    clamp_lo: 0.5     # v1.47.0: 0.6→0.5 (atr_clamp_sweep_study: IS PnL/MDD +44%, MDD -25%, OOS min +5.4%)
    clamp_hi: 1.5     # v1.50.0: 1.7→1.5 (atr_mdd_param_sweep_study: IS PnL/MDD +52%, OOS min +2.4pp, MDD sizing noise-level)
  cooldown_candles: 0
  direction_cap: 6         # v1.65.0: 7→6 (preemptive_param_crossval: COMBO_B OOS +410.7% vs DC7 +408.3%, cluster exposure -14%)
  rescan_interval_days: 60  # v1.35.2: 90→60d (edge half-life 30d, first negative 90d)
  timeout_bars: 288        # v1.48.0: 864→288 (timeout_sweep_study: OOS min +17.5%, scanner MAX_BARS 일치, 24h+ trades net negative)
  # tp_multiplier removed — v1.43.0 ROLLBACK (h7_critical_validation: WF 94% non-discriminating, 95% Cascade-dependent, E[trade] inferior at live WR)
  # v1.67.0: TP mode — 'scale' (uniform factor) or 'mfe_median' (per-pattern MFE median)
  # mfe_median: uses each pattern's MFE median from scanner exc_stats as TP directly.
  #   0 free params (data-derived) → lowest overfit risk (score 30.6, FP=0)
  #   OOS5 +385% vs scale×0.72 +380%, IS P/M 149.3x vs 134.8x
  #   Effective scale per-pattern 0.37~1.44 (median 0.71), adapts to each pattern's MFE shape
  tp_mode: mfe_median
  tp_scale_factor: 0.72  # only used when tp_mode: scale (v1.61.0 legacy fallback)
  tp_decay:                        # v1.63.0: Exponential Time-Decay TP (exp_decay)
    enabled: true
    decay_rate: 0.9975             # v1.63.1: 0.997→0.9975 (decay_rate_optimization: OOS +339.5% vs +332.5%, HL 23.1h)
    update_interval_bars: 6        # Update exchange TP order every 6 bars (30min)
  vol_adaptation:                  # v1.66.0: Volatility-adaptive TP/SL
    enabled: true
    clamp_lo: 0.5                  # min vol_factor (SL shrinks to 50% min in low vol)
    clamp_hi: 2.0                  # max vol_factor (SL expands to 200% max in high vol)
    update_interval_bars: 1        # update every bar (vol_adapt_param_optimization: iv=1 optimal)
  opposite_signal_exit:            # v1.66.0: Close profitable positions on consecutive opposite signals
    enabled: true
    consecutive_signals: 2           # number of opposite-direction signals within window to trigger
    min_profit_pct: 0.1              # minimum unrealized profit (slot %, with leverage) to qualify
    window_bars: 4                   # v1.68.0: time window for counting signals (4 bars=20min, ~3-5 OPP/day matching BT 2.7/day)
  # sl_scale_factor: removed — corrected WF shows SL×1.1 NON-DISCRIMINATING (+429.7% vs SL×1.0 +430.0%)
  # Original "DISCRIMINATING" result was from scripts with buggy fold boundary formula
  pattern_source: dynamic  # 'static' (constants.py) or 'dynamic' (results/dynamic_patterns.json)
  # v1.25.0: Patterns defined in constants.py (VALIDATED_LONG/SHORT_PATTERNS)
  # Per-pattern TP/SL in constants.py PATTERN_OPTIMAL_TPSL (tp_pct/sl_pct are fallback defaults)
  sl_pct: 1.0
  tp_pct: 1.0
symbol: BTC-USDT
timeframe: 5m
