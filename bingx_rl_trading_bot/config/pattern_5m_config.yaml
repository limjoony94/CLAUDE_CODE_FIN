api:
  max_retry_delay: 30
  retry_attempts: 3
  retry_delay: 2
debug_mode: true
exchange_leverage: 10
health_check_interval: 50
json_logging: false
leverage: 3
margin_mode: crossed
max_positions: 9
position_mode: hedge  # 'one_way' (BOTH) or 'hedge' (LONG/SHORT separate)
position_size_pct: 95
risk:
  max_daily_loss_pct: 13   # v1.28.5: 10% → 13% (Per-pattern SL max 4.0% × 3x = 12.1% per loss)
  max_position_size_usd: 10000
  mdd_sizing:              # v1.34.0: MDD-based dynamic position sizing
    enabled: true
    full_size_below_dd: 3.0   # v1.35.2: 5→3% (faster DD response, edge half-life 30d)
    min_size_above_dd: 15.0   # v1.35.2: 20→15% (tighter drawdown protection)
    min_scale: 0.25           # minimum position scale factor
  aggregate_risk_cap:      # v1.35.5: Aggregate directional SL exposure cap
    enabled: true
    counter_cap: 3.0         # counter-regime cap (% portfolio, SHORT in uptrend / LONG in downtrend)
    with_cap: 7.0            # with-regime cap (% portfolio, SHORT in downtrend / LONG in uptrend)
  momentum_guard:          # v1.36.2: Pause counter-dir entries during strong moves
    enabled: true
    lookback_bars: 6         # 6 bars = 30min price change window
    threshold_pct: 1.0       # 1% move triggers guard
    cooldown_bars: 6         # 6 bars = 30min pause after trigger
  regime_sizing:           # v1.35.3: Regime-aware position sizing
    enabled: true
    ema_period: 20           # EMA window for trend detection
    lookback: 5              # slope lookback bars (EMA[now] - EMA[now-5])
    counter_mult: 0.3        # counter-regime size multiplier (MDD lowest: 6.71%)
rotation:
  enabled: false
strategy:
  atr_scale:
    enabled: true
    window: 576       # rolling median window (576봉 = 2일)
    clamp_lo: 0.6     # minimum ratio
    clamp_hi: 1.7     # maximum ratio
  cooldown_candles: 0
  direction_cap: 7         # v1.36.1: cap8→7 (portfolio study: PnL/MDD 14.43x vs 13.54x, corr loss 3.1% vs 3.5%)
  rescan_interval_days: 60  # v1.35.2: 90→60d (edge half-life 30d, first negative 90d)
  timeout_bars: 864        # v1.31.0: 72h position timeout (864 × 5m = 72h, 0 = disabled)
  pattern_source: dynamic  # 'static' (constants.py) or 'dynamic' (results/dynamic_patterns.json)
  # v1.25.0: Patterns defined in constants.py (VALIDATED_LONG/SHORT_PATTERNS)
  # Per-pattern TP/SL in constants.py PATTERN_OPTIMAL_TPSL (tp_pct/sl_pct are fallback defaults)
  sl_pct: 1.0
  tp_pct: 1.0
symbol: BTC-USDT
timeframe: 5m
