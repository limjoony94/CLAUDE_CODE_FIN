# R26 Grid Trading Bot — Configuration
# Pre-reg: claudedocs/round26_grid_ranging_prereg.md (commit bd9a233)
# Verification: round34_r26_leverage_prereg.md (commit eb1a271)

strategy:
  # LOCKED grid parameters (matches BT exactly — DO NOT modify without re-validation)
  grid_spacing_pct: 0.30        # 0.30% between levels (5x friction margin)
  grid_levels_each_side: 5       # 5 buy + 5 sell = 10 total
  trend_exit_distance_pct: 1.5   # force exit when |price - init_mid| > 1.5%
  max_grid_lifetime_bars: 168    # 7 days at 1h
  atr_period: 20
  atr_pct_median_lookback_bars: 720  # 30 days at 1h

  # Per-position STOP_MARKET (real-time SL on exchange, fix for 5min poll latency)
  per_position_stop_loss_enabled: true
  per_position_stop_loss_pct: 2.0   # 2.0% adverse from entry → exchange-side STOP_MARKET
                                      # Cleanly between 1.5% trend_exit and 24.88% liquidation

risk:
  # Auto-size from account balance (NEW)
  auto_size_from_balance: true   # if true: per_level_notional = balance × util × leverage / total_levels
  balance_utilization_pct: 100   # use 100% of balance as max margin
  # Manual fallback if auto_size_from_balance: false
  per_level_notional_usd: 150    # ignored when auto_size_from_balance=true

  # Hard halts (auto sys.exit)
  halt_daily_loss_pct: 3.0       # daily NAV < -3% → halt
  halt_30d_loss_pct: 10.0        # 30d cum NAV < -10% → halt
  halt_consecutive_api_errors: 10
  halt_emergency_adverse_pct: 20.0  # adverse > 20% on open position → emergency close
                                    # At trading_leverage=4×: liquidation = 24.88% → 4.88pp safety buffer
                                    # (was 9.0% mis-calibrated for 10× leverage; corrected for 4×)

exchange:
  symbol: BTC/USDT:USDT  # CCXT format for BingX BTC perpetual swap
  timeframe: 1h
  exchange_leverage: 10           # exchange margin setting (max permission, fixed at user's 10×)
  trading_leverage: 4             # actual position sizing leverage (R34 result: L=4× = first DEPLOYABLE)
                                   # daily +0.21%, liq buffer 24.88% adverse (vs historical max 9.47%)
  position_mode: One-Way          # use BOTH positionSide
  candle_bars_fetch: 800          # need 30d of 1h for ATR median
  hedge_mode_check: true          # BUG#66 protection — verify one-way mode on init

bot:
  poll_interval_seconds: 300      # 5 min poll (grid bots don't need 1m updates)
  warmup_bars: 720                # 30d of 1h for filter

logging:
  log_path: logs/r26_grid.log
  journal_path: logs/r26_trades.jsonl       # structured trade events (one JSON per line)
  state_path: results/r26_grid_state.json
  log_rotate_daily: true
  log_retention_days: 30
  cycle_heartbeat_compact: true             # quiet cycle when nothing changes
  balance_snapshot_every_n_cycles: 12       # log balance every 12 cycles (= 1h at 5min poll)

# API keys path (separate file)
api_keys_path: config/api_keys.yaml
