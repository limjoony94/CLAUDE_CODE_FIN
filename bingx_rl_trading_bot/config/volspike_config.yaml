risk:
  max_risk_per_trade_pct: 5.0   # 5% of balance per trade
  # At 20x: notional = 5% × 20 = 100% of balance per position
  # Initial margin = notional / leverage = 5% per position
  # 10 concurrent: 50% margin used, 50% free
  max_total_exposure_pct: 1000.0  # 10 × 100% = 1000% notional
  max_concurrent_positions: 10    # max 10 simultaneous (50% margin)
  max_daily_loss_pct: 15.0        # daily loss limit (20x amplified)

  # Margin safety:
  # 10 positions × 5% margin = 50% used → 50% free margin buffer
  # Liquidation: all 10 positions 9.5% adverse simultaneously → unlikely
  # Worst SL scenario: 10 × 0.61% = 6.1% equity loss → manageable

monitoring:
  expected_daily_pct: 1.0         # target ~1% daily
  expected_trades_per_day: 4.0
  alert_consecutive_losses: 6     # tighter at 20x
  halt_wr_below: 30.0             # halt if WR < 30% over 50 trades
  halt_eval_trades: 50
