# MAVS-15: Multi-Asset Vol-Spike 15m Strategy
# Option B: D=4.0 | TP=3.0×ATR | SL=1.5×ATR | 44 assets | 15m
# Validated: 365d, MC p=0.000, 1783 trades (4.88/d), R:R 1.85
# Leverage: 20x, 5% pos, max 10 concurrent → target daily ~1%
# MDD ~26%, 청산거리 9.5%, 최악SL동시피격 -12.3%

strategy:
  leverage: 20               # 20x for ~1% daily target
  exchange_leverage: 20
  position_mode: "oneway"   # one position per asset
  max_positions_per_asset: 1
  timeframe: "15m"

  # Vol-spike entry
  displacement_threshold: 4.0   # bar range > 4.0 × ATR(14)
  body_ratio_min: 0.4           # |body| > 40% × range
  atr_period: 14

  # Asymmetric ATR TP/SL (different from entry logic)
  tp_atr_mult: 3.0             # TP = 3.0 × ATR from entry
  sl_atr_mult: 1.5             # SL = 1.5 × ATR from entry → R:R = 2.0
  tp_max_pct: 8.0              # TP ceiling %
  sl_max_pct: 6.0              # SL ceiling %

  # Timeout
  max_hold_hours: 24           # 96 bars at 15m

  # Cooldown
  cooldown_bars: 4             # 1h minimum between trades per asset

