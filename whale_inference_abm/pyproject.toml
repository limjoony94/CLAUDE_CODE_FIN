[project]
name = "whale_inference_abm"
version = "0.0.1"
description = "Open-system ABM with wealth concentration and 3-anchor inverse strategy recovery"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
